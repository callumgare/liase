name: CI

on:
  pull_request:
  push:

permissions:
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - run: npm clean-install

      - name: Lint all packages
        run: npx turbo lint

      - name: Validate current commit with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      LIASE_SECRETS_FILE: ${{ vars.LIASE_SECRETS_FILE }}
      DEBUG: "pw:browser"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - run: npm clean-install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium && npx playwright --version

      - name: Test all packages
        # Use "-u" to ignore snapshot mismatches. Sites may occasionally return different values
        # over time or depending on requester-specific details like geographical location.
        run: npx turbo test -- -u

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/test-results/
            **/coverage/
          retention-days: 7

  list-packages:
    name: List packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: List packages
        id: list-packages
        run: |
          # Get all package names from packages directory, excluding output-viewer
          PACKAGES=$(find packages -name "package.json" -exec dirname {} \; | xargs -I {} basename {} | grep -v "^output-viewer$" | jq -R . | jq -s . | jq -c .)
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Discovered packages: $PACKAGES"

  publish:
    name: |
      ${{
        format(
          'Publish {0}{1}',
          matrix.package,
          case(
            github.ref == 'refs/heads/main',
            '',
            github.ref == 'refs/heads/ci-publish-test',
            ' (pre-release testing version)',
            ' (dry-run)'
          ),
        )
      }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint, test, list-packages]
    strategy:
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm clean-install

      - name: Build
        run: npx turbo build --filter=@liase/${{ matrix.package }}

      - name: Verify provenance attestations and registry signatures
        run: npm audit signatures

      - name: ${{ format('Release{0}', case(github.ref == 'refs/heads/ci-publish-test', ' (pre-release testing version)', '')) }}
        if: (github.ref == 'refs/heads/main') || (github.ref == 'refs/heads/ci-publish-test')
        working-directory: packages/${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Release (dry-run)
        if: (github.ref != 'refs/heads/main') && (github.ref != 'refs/heads/ci-publish-test')
        working-directory: packages/${{ matrix.package }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx semantic-release --dry-run --no-ci --branches "${GITHUB_REF_NAME}" | tee /tmp/semantic-release-dry-run-${{ matrix.package }}.log

      - name: ℹ️ Print publish info
        working-directory: packages/${{ matrix.package }}
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/ci-publish-test" ]]; then
            VERSION=$(jq -r '.version' package.json)
            if [[ ! "$VERSION" == 0.0.0* ]]; then
              prefix_message="Published new version of ${{ matrix.package }}:"
              echo -e "### :rocket: $prefix_message \n\`\`\`\n$VERSION\n\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo -e "$prefix_message\n\e[1m$VERSION\e[0m"
            else
              message="No publishable changes made to ${{ matrix.package }} since last version"
              echo "### $message" >> $GITHUB_STEP_SUMMARY
              echo -e "\e[1m$message\e[0m"
            fi
          else
            LOG_FILE="/tmp/semantic-release-dry-run-${{ matrix.package }}.log"
            VERSION=$(sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9][^ ]*).*/\1/p' "$LOG_FILE" | tail -1)
            if [[ -n "$VERSION" ]]; then
              message="Would publish new version of ${{ matrix.package }} on this branch:"
              echo -e "### :test_tube: $message \n\`\`\`\n$VERSION\n\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo -e "$message\n\e[1m$VERSION\e[0m"
            else
              message="No publishable changes for ${{ matrix.package }} on branch ${GITHUB_REF_NAME}"
              echo "### $message" >> $GITHUB_STEP_SUMMARY
              echo -e "\e[1m$message\e[0m"
            fi
          fi

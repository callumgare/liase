<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>liase preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8/dist/video-js.css" />
  </head>

  <body>
    <div id="app"></div>
    <style>
      #app {
        display: flex;
        flex-direction: column;
        gap: 1em;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 1em;

        #request {
          field-sizing: content;
          flex: 1 1 auto;
          min-height: 10lh;
        }
        .group {
          display: flex;
          flex-direction: column;
          flex: 0 1 auto;
          min-width: min(20em, 100%);
          gap: 1em;

          .group {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 0.5em;
          }
        }
      }
      #response {
        width: 100%;
      }
      .error {
        text-wrap: auto;
      }
      .schema-fields {
        display: flex;
        flex-direction: column;
        gap: 0.5em;

        .field-row {
          display: grid;
          grid-template-columns: 12em 1fr;
          grid-template-rows: auto auto;
          align-items: center;
          gap: 0.25em 0.5em;

          label {
            font-weight: 500;
            white-space: nowrap;
          }
          .field-description {
            grid-column: 2;
            color: #888;
            font-size: 0.85em;
          }
          input[type="text"],
          input[type="number"],
          select {
            width: 100%;
            box-sizing: border-box;
          }
        }
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 1em;

        :first-child {
          flex: 1 1 auto;
        }
      }
      .DisplayMedia {
        display: flex;
        flex-wrap: wrap;
        padding-left: 0;
        gap: 1em;
        justify-content: center;
        li {
          list-style-type: none;
        }
      }
      .MediaPreview {
        display: flex;
        gap: 1em;

        .videoContainer {
          display: grid;
          grid-template-rows: 1fr;
          grid-template-columns: 1fr;

          img,
          video {
            grid-area: 1 / 1 / 2 / 2;
          }

          video {
            grid-area: 1 / 1 / 2 / 2;
            z-index: 1;
          }
        }

        img,
        video {
          max-height: 200px;
        }
        img,
        mux-player {
          width: auto;
        }
        .info {
          max-width: 200px;
        }
        a {
          display: block;
        }
      }
      .pswp__video-container {
        width: 100%;
        height: 100%;
      }
      .pswp__video-container .video-js {
        width: 100%;
        height: 100%;
      }
    </style>
  </body>
  <script type="importmap">
    {
      "imports": {
        "@alenaksu/json-viewer": "https://unpkg.com/@alenaksu/json-viewer@2.1.0/dist/json-viewer.bundle.js",
        "hls.js": "https://unpkg.com/hls.js@1.5.17/dist/hls.js",
        "video.js": "https://cdn.jsdelivr.net/npm/video.js@8/dist/video.min.js",
        "photoswipe": "https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.js",
        "photoswipe/lightbox": "https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.js",
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
  </script>
  <script type="module">
    import { createApp, ref } from "vue";
    import Page from "./components/page.js";

    const app = createApp(Page);
    app.config.compilerOptions.isCustomElement = (tag) =>
      ["json-viewer"].includes(tag);
    app.mount("#app");
  </script>
  <script type="module">
    let buildId;
    const pollInterval = 200;
    setInterval(async () => {
      const res = await fetch("/build-id", {
        signal: AbortSignal.timeout(pollInterval),
      }).catch(() => {});
      if (!res) return;
      const newBuildId = await res.json();
      if (buildId && buildId !== newBuildId) {
        location.reload();
      }
      buildId = newBuildId;
    }, pollInterval);
  </script>
</html>
